  - name: apple-spark-2.12_3.2.0-snapshot-launcher-repl-tools
    branchName: branch-3.2.0-apple
    build:
      template: freestyle:v4:build
      steps:
        - build/sbt -Phadoop-3.2 "launcher/test" "repl/test" "tools/test"

  - name: apple-spark-2.12_3.2.0-snapshot-launcher-repl-tools-pr
    branchName: branch-3.2.0-apple
    build:
      template: freestyle:v4:prb
      steps:
        - build/sbt -Phadoop-3.2 "launcher/test" "repl/test" "tools/test"

  - name: apple-spark-2.12_3.2.0-snapshot-hive-thriftserver
    branchName: branch-3.2.0-apple
    build:
      template: freestyle:v4:build
      steps:
        - build/sbt -Phadoop-3.2 "hive-thriftserver/test" -Phive -Phive-thriftserver

  - name: apple-spark-2.12_3.2.0-snapshot-hive-thriftserver-pr
    branchName: branch-3.2.0-apple
    build:
      template: freestyle:v4:prb
      steps:
        - build/sbt -Phadoop-3.2 "hive-thriftserver/test" -Phive -Phive-thriftserver

  - name: apple-spark-2.12_3.2.0-snapshot-kafka
    branchName: branch-3.2.0-apple
    build:
      template: freestyle:v4:build
      steps:
        - build/sbt -Phadoop-3.2 "streaming-kafka-0-10/test" "sql-kafka-0-10/test" "token-provider-kafka-0-10/test"

  - name: apple-spark-2.12_3.2.0-snapshot-kafka-pr
    branchName: branch-3.2.0-apple

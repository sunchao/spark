schemaVersion: 2.0
timeout: 120

notify:
  email:
    enabled: false
  pullRequestComment:
    postOnSuccess: false
    postOnFailure: false

machine:
  baseImage: docker.apple.com/base-images/ubi8/java11-builder
  env: &base_env
    NOLINT_ON_COMPILE: "1"
    SBT_OPTS: "-Xms6g -Xmx6g -Xss128M -XX:MaxMetaspaceSize=2048M -XX:+CMSClassUnloadingEnabled"

builds:
  - name: apple-spark-2.12_3.2.0-snapshot-common
    branchName: branch-3.2.0-apple
    build:
      template: freestyle:v4:build
      steps:
        - build/sbt -Phadoop-3.2 "sketch/test" "kvstore/test" "network-common/test" "network-shuffle/test" "unsafe/test"

  - name: apple-spark-2.12_3.2.0-snapshot-common-pr
    branchName: branch-3.2.0-apple
    build:
      template: freestyle:v4:prb
      steps:
        - build/sbt -Phadoop-3.2 "sketch/test" "kvstore/test" "network-common/test" "network-shuffle/test" "unsafe/test"

  - name: apple-spark-2.12_3.2.0-snapshot-core
    branchName: branch-3.2.0-apple
    build:
      template: freestyle:v4:build
      steps:
        - build/sbt -Phadoop-3.2 "core/test"

  - name: apple-spark-2.12_3.2.0-snapshot-core-pr

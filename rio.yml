        - PYSPARK_PYTHON=python3 build/sbt -Phadoop-3.2 -Phive "hive/testOnly *.HiveExternalCatalogVersionsSuite" "hive/testOnly *.HiveSparkSubmitSuite" "hive/testOnly *.VersionsSuite" "hive/testOnly *.HiveDDLSuite" "hive/testOnly *.HiveCatalogedDDLSuite" "hive/testOnly *.Hive_2_1_DDLSuite" "hive/testOnly *.HiveSerDeSuite" "hive/testOnly *.HiveQuerySuite" "hive/testOnly *.SQLQuerySuite"

  - name: apple-spark-2.12_3.2.0-snapshot-hive-3
    branchName: branch-3.2.0-apple
    build:
      template: freestyle:v4:build
      steps:
        - build/sbt -Phadoop-3.2 -Phive "hive/testOnly *.HiveCompatibilitySuite"

  - name: apple-spark-2.12_3.2.0-snapshot-hive-3-pr

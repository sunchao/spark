    branchName: branch-3.2.0-apple
    build:
      template: freestyle:v4:build
      steps:
        - build/sbt -Phadoop-3.2 -Pkinesis-asl "streaming-kinesis-asl/test"

  - name: apple-spark-2.12_3.2.0-snapshot-kinesis-pr
    branchName: branch-3.2.0-apple
    build:
      template: freestyle:v4:prb
      steps:
        - build/sbt -Phadoop-3.2 -Pkinesis-asl "streaming-kinesis-asl/test"

  - name: apple-spark-2.12_3.2.0-snapshot-avro
    branchName: branch-3.2.0-apple
    build:
      template: freestyle:v4:build
      steps:
        - build/sbt -Phadoop-3.2 "avro/test"

  - name: apple-spark-2.12_3.2.0-snapshot-avro-pr
    branchName: branch-3.2.0-apple
    build:
      template: freestyle:v4:prb
      steps:
        - build/sbt -Phadoop-3.2 "avro/test"

  - name: apple-spark-2.12_3.2.0-snapshot-yarn-k8s
    branchName: branch-3.2.0-apple
    build:
      template: freestyle:v4:build
      steps:
        - yum install -y python3 # YarnClusterSuite needs python3
        - build/sbt -Phadoop-3.2 -Pyarn -Pkubernetes "yarn/test" "kubernetes/test"

  - name: apple-spark-2.12_3.2.0-snapshot-yarn-k8s-pr
    branchName: branch-3.2.0-apple
    build:
      template: freestyle:v4:prb
      steps:
        - yum install -y python3 # YarnClusterSuite needs python3
        - build/sbt -Phadoop-3.2 -Pyarn -Pkubernetes "yarn/test" "kubernetes/test"

  - name: apple-spark-2.12_3.2.0-snapshot-python36
    branchName: branch-3.2.0-apple
    build:
      template: freestyle:v4:build
      steps:
        - yum install -y python3
        - pip3.6 install numpy==1.16.4 scipy==1.2.2 pandas==1.0.1
        - build/sbt -Phadoop-3.2 test:package
        - python/run-tests.py --python-executables python3.6

  - name: apple-spark-2.12_3.2.0-snapshot-python36-pr
    branchName: branch-3.2.0-apple
    build:
      template: freestyle:v4:prb
      steps:
        - yum install -y python3
        - pip3.6 install numpy==1.16.4 scipy==1.2.2 pandas==1.0.1
        - build/sbt -Phadoop-3.2 test:package
        - python/run-tests.py --python-executables python3.6

  - name: apple-spark-2.12_3.2.0-snapshot
    branchName: branch-3.2.0-apple
    timeout: 120
    machine:
      env:
        <<: *base_env
        SCALA_BINARY_VERSION: "2.12"
        SCALA_VERSION: "2.12.15"
        HADOOP_BINARY_VERSION: "3.2"
        PUBLISH_JARS: true
        MAVEN_OPTS: "-Xms6g -Xmx6g -Xss128M -XX:MaxMetaspaceSize=3g -XX:+CMSClassUnloadingEnabled"
    build:
      template: freestyle:v4:publish
      steps:
        - ./dev/rio-maven-custom-build.sh --scala "$SCALA_BINARY_VERSION" --snapshot --maven-opts "${MAVEN_OPTS}" --maven-params "-P hive,hadoop-${HADOOP_BINARY_VERSION},hadoop-cloud,hive-thriftserver,kinesis-asl,yarn,kubernetes"
        - ci stage-lib --many-many-artifacts ".dist/local-repo/**/*.jar"
        - ci stage-lib --many-many-artifacts ".dist/local-repo/**/*.pom"
    package:
      freeform:
      - publish:
        - repo: m2:oss-patched

  - name: apple-spark-2.12_3.2.0-binaries-snapshot
    branchName: branch-3.2.0-apple
    timeout: 120
    machine:
      env:
        <<: *base_env
        SCALA_BINARY_VERSION: "2.12"
        SCALA_VERSION: "2.12.15"
        HADOOP_BINARY_VERSION: "3.2"
        PUBLISH_JARS: false
        MAVEN_OPTS: "-Xms12g -Xmx12g -Xss128M -XX:MaxMetaspaceSize=4g -XX:+CMSClassUnloadingEnabled"
    build:
      template: freestyle:v4:publish
      steps:
        - ./dev/rio-maven-custom-build.sh --scala "$SCALA_BINARY_VERSION" --snapshot --maven-opts "${MAVEN_OPTS}" --maven-params "-P hive,hadoop-cloud,hadoop-${HADOOP_BINARY_VERSION},hive-thriftserver,kinesis-asl,yarn,kubernetes"
        - ./dev/make-distribution.sh --tgz --use-existing-build --with-hadoop --skip-java-test -DskipTests=true -Dscala-$SCALA_BINARY_VERSION=enabled -Dhive-thriftserver=enabled -Dscala.version="$SCALA_VERSION" -Dscala.binary.version="$SCALA_BINARY_VERSION" -Phadoop-${HADOOP_BINARY_VERSION}
        - ci stage-lib ".dist/local-repo/**/*.tgz,snapshot"
    package:
      freeform:
      - publish:
        - repo: oss-patched-binaries-local

  - name: apple-spark-2.12_3.2.0-release
    branchName: branch-3.2.0-apple-release
    timeout: 120
    machine:
      env:
        <<: *base_env
        SCALA_BINARY_VERSION: "2.12"
        SCALA_VERSION: "2.12.15"
        HADOOP_BINARY_VERSION: "3.2"
        PUBLISH_JARS: true
        MAVEN_OPTS: "-Xms12g -Xmx12g -Xss128M -XX:MaxMetaspaceSize=4g -XX:+CMSClassUnloadingEnabled"
    build:
      template: freestyle:v4:publish
      steps:
        - ./dev/rio-maven-custom-build.sh --scala "$SCALA_BINARY_VERSION" --release --maven-opts "${MAVEN_OPTS}" --maven-params "-P hive,hadoop-cloud,hadoop-${HADOOP_BINARY_VERSION},hive-thriftserver,kinesis-asl,yarn,kubernetes"
        - ci stage-lib --many-many-artifacts ".dist/local-repo/**/*" --exclude "**/*.xml" --exclude "**/*.md5" --exclude "**/*.sha1"
    package:
      release: true
      freeform:
      - publish:
        - repo: m2:oss-patched
    finally:
      tag:
        enabled: true
        expression: "releases_2.12/3.2.0.45-apple"

  - name: apple-spark-2.12_3.2.0-binaries-release
    branchName: branch-3.2.0-apple-release
    timeout: 120
    machine:
      env:
        <<: *base_env
        SCALA_BINARY_VERSION: "2.12"
        SCALA_VERSION: "2.12.15"
        HADOOP_BINARY_VERSION: "3.2"
        PUBLISH_JARS: false
        MAVEN_OPTS: "-Xms12g -Xmx12g -Xss128M -XX:MaxMetaspaceSize=4g -XX:+CMSClassUnloadingEnabled"
    build:
      template: freestyle:v4:publish
      steps:
        - ./dev/rio-maven-custom-build.sh --scala "$SCALA_BINARY_VERSION" --release --maven-opts "${MAVEN_OPTS}" --maven-params "-P hive,hadoop-cloud,hadoop-${HADOOP_BINARY_VERSION},hive-thriftserver,kinesis-asl,yarn,kubernetes"
        - ./dev/make-distribution.sh --tgz --use-existing-build --with-hadoop --skip-java-test -DskipTests=true -Dscala-$SCALA_BINARY_VERSION=enabled -Dhive-thriftserver=enabled -Dscala.version="$SCALA_VERSION" -Dscala.binary.version="$SCALA_BINARY_VERSION" -Phadoop-${HADOOP_BINARY_VERSION}
        - ci stage-lib ".dist/local-repo/**/*.tgz"
    package:
      freeform:
      - publish:
        - repo: oss-patched-binaries-local
